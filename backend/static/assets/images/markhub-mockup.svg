  <rect x="40" y="30" width="720" height="46" rx="16" fill="#1F1D1A" />
  <rect x="40" y="60" width="720" height="16" fill="#1F1D1A" />
  <line x1="40" y1="76" x2="760" y2="76" stroke="#38332E" stroke-width="1" />

