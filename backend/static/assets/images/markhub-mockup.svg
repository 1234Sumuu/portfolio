    <rect x="165" y="65" width="120" height="18" rx="4" fill="#23201D" />
    <rect x="295" y="65" width="140" height="18" rx="4" fill="#23201D" />
    <rect x="445" y="65" width="130" height="18" rx="4" fill="#23201D" />

    <text x="175" y="78" font-family="monospace" font-size="9" fill="#78716C">STATUS: OK</text>
    <text x="305" y="78" font-family="monospace" font-size="9" fill="#78716C">LATENCY: 42ms</text>
    <text x="455" y="78" font-family="monospace" font-size="9" fill="#06B6D4">VERIFIED BUILD</text>

    <!-- Simulated Chart or Terminal -->
    <path d="M 165 140 Q 220 100 280 120 T 380 95 T 480 115 T 575 85" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.8" />
    <path d="M 165 140 Q 220 100 280 120 T 380 95 T 480 115 T 575 85 L 575 145 L 165 145 Z" fill="#06B6D4" fill-opacity="0.08" />
