    <rect x="15" y="80" width="60" height="6" rx="3" fill="#2E2B28" />
    <rect x="15" y="110" width="80" height="24" rx="6" fill="#06B6D4" fill-opacity="0.3" stroke="#06B6D4" stroke-width="0.8" />
    <text x="55" y="126" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="9" font-weight="700" fill="#06B6D4" text-anchor="middle">ACTIVE RUN</text>

