  </text>
  <rect x="630" y="44" width="105" height="20" rx="10" fill="#06B6D4" fill-opacity="0.2" stroke="#06B6D4" stroke-width="1" />
  <text x="682" y="57" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="700" fill="#06B6D4" text-anchor="middle" letter-spacing="0.5">
    VERIFIED LIVE
